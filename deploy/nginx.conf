server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /tonconnect-manifest.json {
        add_header Access-Control-Allow-Origin *;
    }
}
